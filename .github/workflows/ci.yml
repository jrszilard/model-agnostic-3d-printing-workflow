name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml pillow matplotlib numpy

      - name: Run public repository guard
        run: python3 scripts/check-public.py

      - name: Run workflow test suite
        run: platform/pipeline/test.sh
