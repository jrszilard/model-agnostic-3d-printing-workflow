# SUNLU TPU 95A @COREONE — AS PRINTED (project preset, not vendor-qualified)
#
# This is the filament half of the settings every usb-cloud TPU plate has actually been
# sliced with, headless, since the R2 round: `Generic FLEX @COREONE` plus the values
# below. It supersedes SUNLU_TPU_95A_COREONE_STARTER.ini, which recorded what SUNLU's
# product page ALLOWED (210 C / 55 C bed) rather than what the printed coupons settled on.
# The differences are physical findings, not preferences — see
# parts/media/usb-cloud-holder/qa/TPU-R1-OBSERVATIONS.md:
#
#   215 first layer / 210 rest   R1's first layer was weak and stringy at 210.
#   60 C bed (both)              55 released hard on smooth PEI; 60 + satin + glue stick
#                                is the sheet recipe that stopped destructive adhesion.
#   chamber off                  TPU does not need it and the Core One's fan management
#                                for a heated chamber fights the low flow cap.
#   2.5 mm3/s cap                The binding constraint on every print so far: a 25 h
#                                cloud measured 2.506 mm3/s average against this cap, so
#                                99% of its runtime is explained by the cap alone. Speeds
#                                are NOT the lever — this is. Raising it is untested.
#   0.4 mm retract, 25 mm/s      R1 strung inside the slots with retraction off; 0.4 at a
#                                slow 25 mm/s pulls back without grinding a soft filament.
#   no lift, no layer-change retract   Nothing to clear on a face-up part, and every extra
#                                retract on TPU is a chance to buckle the filament.
#
# Install: copy to ~/.config/PrusaSlicer/filament/ and restart PrusaSlicer, or recreate it
# in the GUI by selecting Generic FLEX @COREONE and typing the values below.
inherits = Generic FLEX @COREONE

filament_type = FLEX
filament_vendor = Custom

# Temperatures
first_layer_temperature = 215
temperature = 210
first_layer_bed_temperature = 60
bed_temperature = 60
chamber_temperature = 0

# Throughput. Everything else on this bench is downstream of this number.
filament_max_volumetric_speed = 2.5

# Retraction: present but gentle.
filament_retract_length = 0.4
filament_retract_speed = 25
filament_deretract_speed = 25
filament_retract_before_travel = 1
filament_retract_layer_change = 0
filament_travel_max_lift = 0

# Density and cost are NOT print settings, but leaving them at Generic FLEX's 0 makes every sliced
# TPU plate report "0.00 g" -- which silently disables the plate-weight sanity check that catches
# PrusaSlicer's multi-STL failure mode (it slices only the LAST file and exits 0). 1.21 g/cm3 is
# the standard TPU 95A figure; cost is a nominal spool price and affects nothing but the estimate.
filament_density = 1.21
filament_cost = 28
