# SUNLU TPU 95A @COREONE starter profile (project-local, NOT vendor-qualified)
#
# SUPERSEDED FOR SLICING by SUNLU_TPU_95A_COREONE.ini (+ print/TPU_020_SLOW_COREONE.ini),
# which records what the printed coupons settled on rather than what the datasheet allows:
# 215/210 C, 60 C bed, 0.4 mm retraction. Kept because it is the paper trail for WHERE the
# starting numbers came from -- do not slice with it, and do not "fix" it to match.
#
# Source basis: SUNLU product page "SUNLU TPU 95A/90A Flexible 3D Printer
# Filament 1KG, 1.75mm" states TPU 95A printing temperature 190-210 C at
# 50-80 mm/s or 210-230 C at 80-120 mm/s, and plate temperature 50-60 C.
# This bench starts at the low-speed end and caps volumetric throughput for
# Core One's direct drive; this is a starting point, not a qualified fit.

# Material identity / thermal window (SUNLU product page)
filament_type = FLEX
filament_vendor = Custom
filament_density = 1.23
filament_spool_weight = 0
first_layer_temperature = 210
temperature = 210
first_layer_bed_temperature = 55
bed_temperature = 55
# Conservative process start; SUNLU's speed table allows more, but the coupon
# proves feed stability before speed becomes a variable.
filament_max_volumetric_speed = 2.5
# TPU defaults: no aggressive first-layer blast, no bridge-specific surprise.
disable_fan_first_layers = 4
min_fan_speed = 0
max_fan_speed = 35
bridge_fan_speed = 35
full_fan_speed_layer = 8
