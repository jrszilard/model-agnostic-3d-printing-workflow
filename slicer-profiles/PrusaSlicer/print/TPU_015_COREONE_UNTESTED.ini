# 0.15mm TPU @COREONE 0.4 — UNTESTED. Generated 2026-09-17, no coupon behind it.
#
# READ THIS BEFORE SLICING WITH IT. The qualified TPU recipe on this bench is
# TPU_020_SLOW_COREONE.ini + SUNLU_TPU_95A_COREONE.ini, and those numbers came off printed
# coupons (R1/R2 + the 25 h cloud). THIS preset is a 43-override jump made from profile
# reading alone, which is against how this bench works — every number in the qualified pair
# was changed one at a time with a physical acceptance. Treat this as a starting point to
# ladder down from, not a peer of the qualified pair. Name says UNTESTED for that reason.
#
# WHY 0.15 COSTS NOTHING IN TIME, and why that is not a reason to use it.
# At a binding volumetric cap, total extrusion time = part volume / Q, INDEPENDENT of layer
# height: speed scales as 1/h and layer count as 1/h, and they cancel. So 0.15 is ~free
# against 0.20 except for per-layer overhead. This bench already measured the same fact from
# the other direction -- the 25 h cloud ran 99% flow-limited at 2.506 mm3/s average, and
# DOUBLING infill speed bought 13 minutes. Speeds are not the lever; the CAP is.
#
# THE ACTUAL LEVER IS THE NOZZLE, and it is not recorded anywhere else in this repo:
#     Generic FLEX @COREONE      2.5 mm3/s      a ~36 cm3 part = 4.0 h
#     Generic FLEX @COREONE 0.6  3.5 mm3/s                    = 2.9 h
#     Generic FLEX @COREONE 0.8  7.5 mm3/s                    = 1.3 h
# The cap is a FILAMENT setting that varies by nozzle preset. For any bulky TPU part, swapping
# the nozzle is worth more than every speed field on this page combined.
#
# PARENT CHOICE IS DELIBERATE. `0.15mm STRUCTURAL @COREONE 0.4` inherits *C1_Shared04*, which
# omits the high-flow term, so this stays valid on BOTH the 0.4 and the HF0.4. The qualified
# TPU_020_SLOW parent (`0.20mm SPEED @COREONE 0.4`) inherits *C1_04* with `! nozzle_high_flow[0]`
# and is therefore INVALID while the HF0.4 is installed -- worth knowing before the next TPU plate.
#
# WHAT IS UNTESTED HERE, explicitly:
#   * the 8 accelerations. Nothing on this bench has ever tuned a TPU acceleration.
#   * max_volumetric_extrusion_rate_slope_* (the pressure equalizer, stock 0). This is the
#     field built for soft filament with pressure advance off, and PA *is* off -- *FLEX* ships
#     `M900 K0`. Both are one-variable experiments, not settled values.
#   * gyroid. The qualified recipe never changed fill_pattern.
# NOT untested, and the one defect this preset actually fixes: TPU_020_SLOW leaves
# `gap_fill_speed` at the parent's 120 mm/s while its walls run 30. Gap fill is short
# high-frequency strokes -- the feature most likely to blob in TPU -- and it has been running
# 4x the wall speed through every plate on this bench, including the 25 h one.
inherits = 0.15mm STRUCTURAL @COREONE 0.4
perimeters = 3
staggered_inner_seams = 1
fill_pattern = gyroid
skirts = 3
skirt_distance = 3
skirt_height = 1
brim_type = no_brim
brim_width = 0
support_material = 0
support_material_auto = 0
support_material_interface_spacing = 0.6
support_material_xy_spacing = 150%
support_material_interface_layers = 2
support_material_bottom_interface_layers = 0
support_material_with_sheath = 0
perimeter_speed = 35
external_perimeter_speed = 22
small_perimeter_speed = 15
infill_speed = 35
solid_infill_speed = 35
top_solid_infill_speed = 20
gap_fill_speed = 20
bridge_speed = 22
support_material_speed = 30
support_material_interface_speed = 50%
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 10
overhang_speed_1 = 15
overhang_speed_2 = 25
overhang_speed_3 = 50%
first_layer_speed = 15
first_layer_infill_speed = 15
default_acceleration = 1000
perimeter_acceleration = 800
external_perimeter_acceleration = 600
infill_acceleration = 1000
solid_infill_acceleration = 1000
top_solid_infill_acceleration = 600
bridge_acceleration = 500
first_layer_acceleration = 300
max_volumetric_extrusion_rate_slope_positive = 1.8
max_volumetric_extrusion_rate_slope_negative = 1.8
