# 0.20mm TPU SLOW @COREONE 0.4 — the PROCESS half of the usb-cloud TPU recipe.
#
# PrusaSlicer splits these settings across two presets: temperatures, flow cap and
# retraction are FILAMENT settings (SUNLU_TPU_95A_COREONE.ini), speeds are PRINT
# settings and live here. Selecting only one of the two gets you half the recipe.
#
# Every speed here is at or below what the 2.5 mm3/s volumetric cap allows anyway, so
# they mostly serve as a floor for the small features the cap does not reach: a measured
# 25 h cloud spent 99% of its runtime flow-limited, and DOUBLING infill speed bought
# 13 minutes of it. Do not expect speed edits to shorten a TPU print on this bench.
#
# 15 mm/s first layer is the R1 finding: TPU laid faster than that on smooth PEI gave a
# weak, stringy bottom skin. 20 mm/s top solid infill is for the visible top face.
#
# Install: copy to ~/.config/PrusaSlicer/print/ and restart PrusaSlicer, or select
# "0.20mm SPEED @COREONE 0.4" in the GUI and type the values below.
inherits = 0.20mm SPEED @COREONE 0.4

first_layer_speed = 15
first_layer_infill_speed = 15
external_perimeter_speed = 30
perimeter_speed = 30
small_perimeter_speed = 15
infill_speed = 30
solid_infill_speed = 30
top_solid_infill_speed = 20
